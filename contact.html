<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Starlite Computer Services</title>
  <meta name="description" content="Contact Starlite Computer Services for a UPS quote, installation, repair or maintenance contract.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="canonical" href="https://www.starlitecomputerservices.com/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Starlite Computer Services">
  <meta property="og:title" content="Contact | Starlite Computer Services">
  <meta property="og:description" content="Contact Starlite Computer Services for a UPS quote, installation, repair or maintenance contract.">
  <meta property="og:url" content="https://www.starlitecomputerservices.com/contact.html">
  <meta property="og:image" content="https://www.starlitecomputerservices.com/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <script>try{if(localStorage.getItem("starlit-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
</head>
<body data-page="contact">
<a class="skip-link" href="#main">Skip to content</a>

<header id="site-header"></header>

<main id="main">
  <div class="wrap page-head">
    <h1>Get a quote</h1>
    <p>Tell us what you need and we'll reply with next steps. No obligation.</p>
  </div>
  <div class="wrap contact-grid">
    <dl class="details" id="contact-details"></dl>
    <form class="form" id="contact-form" novalidate>
      <div class="row">
        <label>Your name
          <input type="text" id="name" name="name" autocomplete="name" required>
        </label>
        <label>Email address
          <input type="email" id="email" name="email" autocomplete="email" required>
        </label>
      </div>
      <label>Phone number <span class="optional">(optional, if you'd like a call back)</span>
        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel">
      </label>
      <label>What do you need help with?
        <select id="topic" name="topic"></select>
      </label>
      <label>Tell us more
        <textarea id="message" name="message" required placeholder="For example: 10 kVA online UPS for a server room in Hyderabad, about 30 minutes backup."></textarea>
      </label>
      <button type="submit" class="btn">Send request</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="wrap">
    <h2 class="maps-title">Visit our offices</h2>
    <div class="maps" id="office-maps"></div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="script.js"></script>
</body>
</html>
